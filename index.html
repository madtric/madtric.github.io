<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>madtric</title>
  <meta name="description" content="madtric의 프로젝트 포트폴리오">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="wrap hero">
    <h1>madtric</h1>
    <p class="lead">iOS 앱과 자동화 도구를 만듭니다.</p>
    <nav class="links">
      <a href="https://github.com/madtric">GitHub</a>
    </nav>
  </header>

  <main class="wrap">
    <section aria-labelledby="projects-title">
      <div class="section-head">
        <h2 id="projects-title">프로젝트</h2>
        <div class="filters" id="filters" role="group" aria-label="분류 필터"></div>
      </div>
      <ul class="grid" id="projects"></ul>
      <noscript><p>프로젝트 목록을 보려면 JavaScript가 필요합니다.</p></noscript>
    </section>
  </main>

  <footer class="wrap footer">
    <p>© <span id="year"></span> madtric</p>
  </footer>

  <script src="assets/main.js"></script>
</body>
</html>
